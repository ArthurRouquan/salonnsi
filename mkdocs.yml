site_name: Salon NSI

site_url: https://salonnsi.fr

repo_url: https://github.com/arthurrouquan/salonnsi
repo_name: arthurrouquan/salonnsi

theme:
  logo: assets/salon-lion.png
  favicon: assets/salon-lion-favicon-block.svg
  language: fr
  name: material

  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/weather-night 
        name: Mode sombre

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Mode clair


  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.instant.prefetch
    
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - open-in-new-tab

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - pymdownx.details
  - pymdownx.keys
  - footnotes

extra_javascript:
  - javascripts/katex.js
  - javascripts/slideshow.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - stylesheets/colors.css
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

nav:
  - "Accueil": index.md
  - "Annales":
      - annales/index.md
  - "Exposition": exposition/index.md
  - "Fiches":
      - fiches/index.md
      - fiches/poo.md
      - fiches/lineaire.md
      - fiches/recursivite.md
      - fiches/dac.md
      - fiches/dp.md
      - fiches/sql.md
      - fiches/arbres.md
      - fiches/graphes.md
      - fiches/reseaux.md
      - fiches/architecture.md
      - fiches/os.md
      - fiches/coeur.md

not_in_nav: |
  /annales/corrections/*
  fiches/python.md
