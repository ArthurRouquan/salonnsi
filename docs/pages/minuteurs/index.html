<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuteurs</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="stopwatch-solid.svg" />
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="global-clock-pill">
                <span id="currentTime">00:00:00</span>
            </div>
            <div id="editableTitle" class="editable-title" contenteditable="true">Titre du minuteur</div>
            <div class="floating-input" id="floatingInput">
                <button class="fullscreen-btn" id="fullscreenBtn" type="button"><span class="material-icons">fullscreen</span></button>
                <button class="mute-btn" id="muteBtn" type="button"><span class="material-icons">volume_up</span></button>
                <div class="pill-controls">
                    <button class="pill-btn" id="defaultMinus" type="button"><span class="material-icons">remove</span></button>
                    <input type="number" id="defaultMinutes" value="5" min="1" max="999" placeholder="5">
                    <button class="pill-btn" id="defaultPlus" type="button"><span class="material-icons">add</span></button>
                </div>
                <button class="add-timer-btn" id="addTimerBtn" type="button"><span class="material-icons">add</span></button>
            </div>
        </div>

        <main>
            <div class="timers-container" id="timersContainer">
                <!-- Timers will be dynamically added here -->
            </div>
        </main>
    </div>

    <!-- Audio element for timer completion sound -->
    <audio id="timerSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
    </audio>
    <audio id="notificationSound" preload="auto">
        <source src="notification.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
